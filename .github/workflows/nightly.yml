name: nightly
run-name: Nightly checks on ${{ github.ref_name }}

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: ${{ github.event_name != 'schedule' || github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Build web assets and sync Capacitor
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: cbreader-nightly-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android build reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports-${{ github.run_number }}
          path: |
            android/build/report/
            android/build/reports/
          if-no-files-found: ignore
          retention-days: 14
